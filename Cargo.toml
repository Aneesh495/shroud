[workspace]
resolver = "2"
members = [
    "crates/shroud-core",
    "crates/shroud-validator",
    "crates/shroud-rhai",
    "crates/shroud-wgpu",
    "crates/shroud-c",
    "crates/shroud-cli",
]

[workspace.package]
version = "0.1.0"
authors = ["Aneesh Krishna Parthasarathy <aneesh495@users.noreply.github.com>"]
edition = "2021"
license = "ISC"
repository = "https://github.com/Aneesh495/shroud"
readme = "README.md"
keywords = ["webgpu", "wgsl", "radiative-transfer", "lidar-simulation", "path-tracing"]
categories = ["graphics", "simulation", "rendering"]

[workspace.dependencies]
rhai = { version = "1.20", features = ["sync", "decimal"] }
naga = { version = "24.0", features = ["wgsl-in", "wgsl-out"] }
wgpu = { version = "24.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
